name: Uv lock check

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  check-uv-lock:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "latest"
        python-version: "3.13"
        activate-environment: false  # activate is not needed for uv lock --check

    - name: Run uv lock --check
      run: |
        uv lock --check
