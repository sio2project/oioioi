name: Uv lock check

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  check-uv-lock:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: "latest"
        python-version: "3.13"
        activate-environment: false  # activate is not needed for uv lock --check

    - name: Run uv lock --check
      run: |
        uv lock --check
