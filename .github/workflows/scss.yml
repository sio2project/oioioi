name: SCSS

# Compiles every stylesheet with the production SCSS compiler (oioioi/base/tests/test_scss.py).
# Unit tests (pytest.yml) skip these tests, because the stylesheets import Bootstrap from node_modules.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scss:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-env
    - uses: ./.github/actions/setup-pnpm

    - name: Install node dependencies
      run: |
        pnpm install --frozen-lockfile

    - name: Compile stylesheets
      env:
        # Fail instead of skipping when node_modules is missing.
        OIOIOI_SCSS_TESTS_REQUIRED: "1"
      run: |
        ./test.sh oioioi/base/tests/test_scss.py
