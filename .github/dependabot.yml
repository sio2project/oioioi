version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows (and a root action.yml); the glob picks up
    # every composite action under .github/actions.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        # Majors (potentially breaking) still arrive as separate PRs.
        update-types:
          - "minor"
          - "patch"
    # Wait a week before proposing new releases (supply-chain safety).
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    # "/" holds pnpm-lock.yaml for the whole pnpm workspace, including
    # oioioi_cypress (see pnpm-workspace.yaml).
    directory: "/"
    schedule:
      interval: "weekly"
    # Pinned on purpose in package.json; upgrade them by hand.
    ignore:
      - dependency-name: "ace-builds"
      - dependency-name: "jqtree"
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Many pyproject.toml pins are deliberate: only refresh uv.lock within
    # the constraints and bump them by hand. Unbounded and transitive
    # packages can still get major bumps, which arrive as separate PRs.
    versioning-strategy: "lockfile-only"
    groups:
      uv:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
