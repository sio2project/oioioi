version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows (and a root action.yml); composite actions
    # under .github/actions must be listed explicitly.
    directories:
      - "/"
      - "/.github/actions/setup-env"
      - "/.github/actions/setup-uv"
      - "/.github/actions/setup-pnpm"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        # Majors (potentially breaking) still arrive as separate PRs.
        update-types:
          - "minor"
          - "patch"
    # Wait a week before proposing new releases (supply-chain safety).
    cooldown:
      default-days: 7
