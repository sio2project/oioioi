name: Setup environment
description: Setup python environment with uv and install apt dependencies

inputs:
  install-texlive:
    description: "Whether to install texlive dependencies"
    required: false
    # Composite actions don't support boolean inputs yet.
    # See https://github.com/actions/runner/issues/2238
    default: "false"
  dependency-groups:
    description: "Space-separated uv dependency groups to install in addition to the default ones"
    required: false
    default: ""

runs:
  using: "composite"

  steps:
  - name: Install apt dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y curl libpq-dev libdb-dev libmemcached-dev
    shell: sh

  - name: Install texlive
    if: inputs.install-texlive == 'true'
    # Same packages as in the Dockerfile. Recommends would pull in ~800 MB
    # (Java, texlive docs, unused languages), and docs are skipped as well.
    run: |
      printf 'path-exclude=/usr/share/doc/*\npath-exclude=/usr/share/man/*\npath-exclude=/usr/share/info/*\n' | sudo tee /etc/dpkg/dpkg.cfg.d/01-nodoc
      sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
        texlive-latex-base texlive-lang-polish texlive-latex-extra texlive-lang-german \
        texlive-lang-european texlive-lang-czechslovak texlive-pstricks \
        texlive-fonts-recommended tex-gyre ghostscript
    shell: sh

  - name: Install uv
    uses: ./.github/actions/setup-uv
    with:
      activate-environment: "true"

  - name: Install python dependencies
    env:
      DEPENDENCY_GROUPS: ${{ inputs.dependency-groups }}
    run: |
      set --
      for group in $DEPENDENCY_GROUPS; do set -- "$@" --group "$group"; done
      uv sync --locked "$@"
    shell: sh
