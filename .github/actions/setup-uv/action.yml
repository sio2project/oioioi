name: Setup uv
description: Install uv and Python (single source of truth for the setup-uv pin and settings)

inputs:
  activate-environment:
    description: "Whether to activate the project virtual environment"
    required: false
    # Composite actions don't support boolean inputs yet.
    # See https://github.com/actions/runner/issues/2238
    default: "false"

runs:
  using: "composite"

  steps:
  # Two variants with literal values: a templated `activate-environment` is
  # re-evaluated as "" in setup-uv's post step when this action is nested in
  # another composite (setup-env), which setup-uv rejects as a boolean input.
  - name: Install uv
    if: inputs.activate-environment != 'true'
    uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    with:
      # Pinned for reproducibility; bump by hand (Dependabot does not track this input).
      version: "0.13.1"
      python-version: "3.13"
      activate-environment: false

  - name: Install uv and activate environment
    if: inputs.activate-environment == 'true'
    uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    with:
      version: "0.13.1" # Keep in sync with the step above.
      python-version: "3.13"
      activate-environment: true
