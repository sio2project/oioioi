name: Setup pnpm
description: Install Node.js and pnpm (single source of truth for their action pins and versions)

inputs:
  cache:
    description: "Whether to cache the pnpm store (keyed on pnpm-lock.yaml)"
    required: false
    # Composite actions don't support boolean inputs yet.
    # See https://github.com/actions/runner/issues/2238
    default: "true"

runs:
  using: "composite"

  steps:
  # pnpm must be on PATH before setup-node, which runs `pnpm store path` for `cache: pnpm`.
  - name: Install pnpm
    uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    with:
      version: 12 # Same as in Dockerfile.
      run_install: false

  # Two variants with literal values, like in setup-uv: setup-node's post step
  # (which saves the cache) re-reads its inputs, so keep them free of templates.
  - name: Install Node.js and restore the pnpm store
    if: inputs.cache == 'true'
    uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
    with:
      node-version: 24 # Same as in Dockerfile.
      cache: pnpm
      cache-dependency-path: pnpm-lock.yaml

  - name: Install Node.js
    if: inputs.cache != 'true'
    uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
    with:
      node-version: 24 # Keep in sync with the step above.
