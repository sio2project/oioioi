name: Setup pnpm
description: Install Node.js and pnpm (single source of truth for their action pins and versions)

runs:
  using: "composite"

  steps:
  - name: Install Node.js
    uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
    with:
      node-version: 24 # Same as in Dockerfile.

  - name: Install pnpm
    uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    with:
      version: 12 # Same as in Dockerfile.
      run_install: false
