name: Setup pnpm
description: Install pnpm (single source of truth for the pnpm-action pin and version)

runs:
  using: "composite"

  steps:
  - name: Install pnpm
    uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    with:
      version: 9 # Same as in Dockerfile.
      run_install: false
